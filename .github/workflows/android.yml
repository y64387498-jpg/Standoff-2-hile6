name: Build Android ESP Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        run: |
          unzip -o Standoff2_ESP_Demo.zip -d source

      - name: Fix JVM Compatibility
        run: |
          cd source/Standoff2_ESP_Demo/app
          cat >> build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: source/Standoff2_ESP_Demo
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Demo-APK
          path: source/Standoff2_ESP_Demo/app/build/outputs/apk/debug/*.apk
